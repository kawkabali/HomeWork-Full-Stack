<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Registration Form</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div style="border: 1px solid #000; width: 620px; padding: 25px; margin: 20px auto; font-family: 'Times New Roman', Times, serif;">
        
        <h1 style="color: red; font-size: 32px; font-weight: normal; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 15px;">
            <i class="fa-solid fa-user-tie" style="font-size: 50px; color: #3b5998;"></i>
            Employee Registration Form
        </h1>

        <form>
            <table cellpadding="6" cellspacing="0" style="width: 100%; font-size: 18px;">
                
                <tr>
                    <td style="width: 35%;"></td>
                    <td>
                        <input type="radio" name="title" id="mr" checked> <label for="mr">Mr.</label>
                        <input type="radio" name="title" id="mrs"> <label for="mrs">Mrs.</label>
                        <input type="radio" name="title" id="ms"> <label for="ms">Ms.</label>
                    </td>
                </tr>

                <tr>
                    <td><label>First Name</label></td>
                    <td><input type="text" placeholder="First Name" style="width: 75%; padding: 4px;"></td>
                </tr>

                <tr>
                    <td><label>Last Name</label></td>
                    <td><input type="text" placeholder="Last Name" style="width: 75%; padding: 4px;"></td>
                </tr>

                <tr>
                    <td><label>Mail Address1</label></td>
                    <td><input type="text" style="width: 75%; padding: 4px;"></td>
                </tr>

                <tr>
                    <td><label>Mail Address2</label></td>
                    <td><input type="text" style="width: 75%; padding: 4px;"></td>
                </tr>

                <tr>
                    <td><label>City</label></td>
                    <td><input type="text" style="width: 75%; padding: 4px;"></td>
                </tr>

                <tr>
                    <td><label>State</label></td>
                    <td>
                        <select style="width: 45%; padding: 4px;">
                            <option>Gujarat</option>
                            <option>Other</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label>Zip</label></td>
                    <td><input type="text" style="width: 45%; padding: 4px;"></td>
                </tr>

                <tr>
                    <td><label>Upload Photo</label></td>
                    <td><input type="file"></td>
                </tr>

                <tr>
                    <td><label>E-Mail</label></td>
                    <td><input type="email" style="width: 90%; padding: 4px;"></td>
                </tr>

                <tr>
                    <td><label>Mobile</label></td>
                    <td><input type="text" value="+91" style="width: 55%; padding: 4px;"></td>
                </tr>

                <tr>
                    <td valign="top" style="padding-top: 10px;"><label>Languages known</label></td>
                    <td style="line-height: 2;">
                        <input type="checkbox" id="gujarati" checked> <label for="gujarati">Gujarati</label><br>
                        <input type="checkbox" id="hindi" checked> <label for="hindi">Hindi</label><br>
                        <input type="checkbox" id="english" checked> <label for="english">English</label><br>
                        <input type="checkbox" id="marathi"> <label for="marathi">Marathi</label>
                    </td>
                </tr>

                <tr>
                    <td valign="top" style="padding-top: 10px;"><label>Additional Information</label></td>
                    <td>
                        <textarea placeholder="Optional" rows="5" style="width: 90%; resize: none; padding: 4px;"></textarea>
                    </td>
                </tr>

                <tr>
                    <td></td>
                    <td style="padding-top: 15px;">
                        <input type="submit" value="submit" style="padding: 4px 15px; font-size: 16px;">
                        <input type="reset" value="reset" style="padding: 4px 15px; font-size: 16px;">
                    </td>
                </tr>

            </table>
        </form>
    </div>

</body>
</html>
